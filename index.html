<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <title>CL300 Fuel Optimizer</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f3ef;color:#1f1d18}
    .wrap{max-width:860px;margin:0 auto;padding:16px}
    h1{margin:0 0 8px;font-size:1.9rem}.sub{color:#666;margin-bottom:14px}
    .card{background:#fff;border:1px solid #d7d3cc;border-radius:14px;padding:14px;margin-top:14px}
    .row{display:grid;gap:8px;margin-bottom:12px}.grid{display:grid;gap:12px}
    @media(min-width:800px){.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}}
    label{font-weight:700;font-size:.95rem} input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #d7d3cc;border-radius:10px;font:inherit;box-sizing:border-box}
    button{min-height:46px;padding:12px 16px;border-radius:12px;border:none;font-weight:700;font-size:1rem;margin-right:8px;margin-bottom:8px}
    .primary{background:#005f66;color:#fff}.secondary{background:#e9e5de;color:#1f1d18}
    .out{background:#f8f6f1;border:1px solid #d7d3cc;border-radius:12px;padding:12px;margin-top:10px}
    .small{font-size:.92rem;color:#666}.big{font-size:1.2rem;font-weight:800}
  </style>
</head>
<body>
<div class="wrap">
  <h1>CL300 Fuel Optimizer</h1>
  <div class="sub">Simple iPhone-safe version. Plane fuel in pounds. FBO fuel in gallons at 6.7 lb/gal.</div>

  <div class="card">
    <button class="secondary" ontouchend="loadSample();event.preventDefault();" onclick="loadSample()">Load Sample</button>
    <button class="primary" ontouchend="runCalc();event.preventDefault();" onclick="runCalc()">Run Optimizer</button>
    <button class="secondary" ontouchend="showText();event.preventDefault();" onclick="showText()">Show Savings Text</button>
    <div class="small" id="taptest">Tap a button. If this line changes, the buttons work.</div>
  </div>

  <div class="card">
    <div class="row"><label>Aircraft / mission</label><input id="aircraft" value="Challenger 300 max-savings profile"></div>
  </div>

  <div class="grid grid3">
    <div class="card">
      <div class="row"><label>Stop 1 fuel price ($/gal)</label><input id="price1" type="number" value="4.62"></div>
      <div class="row"><label>Starting fuel before stop 1 uplift (lb)</label><input id="startFuel1" type="number" value="0"></div>
      <div class="row"><label>Leg 1 trip fuel (lb)</label><input id="burn1" type="number" value="2550"></div>
      <div class="row"><label>Leg 1 time (hours)</label><input id="time1" type="number" value="1.3"></div>
      <div class="row"><label>Stop 1 waiver minimum (gal)</label><input id="waiverFuel1" type="number" value="0"></div>
      <div class="row"><label>Stop 1 handling fee ($)</label><input id="handling1" type="number" value="0"></div>
    </div>
    <div class="card">
      <div class="row"><label>Stop 2 fuel price ($/gal)</label><input id="price2" type="number" value="6.55"></div>
      <div class="row"><label>Leg 2 trip fuel (lb)</label><input id="burn2" type="number" value="2050"></div>
      <div class="row"><label>Leg 2 time (hours)</label><input id="time2" type="number" value="1.1"></div>
      <div class="row"><label>Stop 2 waiver minimum (gal)</label><input id="waiverFuel2" type="number" value="400"></div>
      <div class="row"><label>Stop 2 handling fee ($)</label><input id="handling2" type="number" value="525"></div>
    </div>
    <div class="card">
      <div class="row"><label>Stop 3 fuel price ($/gal)</label><input id="price3" type="number" value="6.05"></div>
      <div class="row"><label>Leg 3 trip fuel (lb)</label><input id="burn3" type="number" value="2250"></div>
      <div class="row"><label>Leg 3 time (hours)</label><input id="time3" type="number" value="1.4"></div>
      <div class="row"><label>Stop 3 waiver minimum (gal)</label><input id="waiverFuel3" type="number" value="300"></div>
      <div class="row"><label>Stop 3 handling fee ($)</label><input id="handling3" type="number" value="375"></div>
    </div>
  </div>

  <div class="card grid grid2">
    <div class="row"><label>Carry burn rate per hour</label><input id="carryRate" type="number" value="0.013"></div>
    <div class="row"><label>Max extra fuel beyond stop 2 (lb)</label><input id="extraCap12" type="number" value="2200"></div>
    <div class="row"><label>Max extra fuel through stop 3 (lb)</label><input id="extraCap13" type="number" value="3900"></div>
  </div>

  <div class="card">
    <div class="big" id="headline">No result yet.</div>
    <div class="out" id="results">Tap Run Optimizer.</div>
    <div class="out" id="textdump">Savings text will show here.</div>
  </div>
</div>
<script>
var LB_PER_GAL = 6.7;
function g(id){ return document.getElementById(id); }
function n(id){ var v=parseFloat(g(id).value); return isFinite(v)&&v>0?v:0; }
function money(v){ return '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function lbs(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:1})+' lb'; }
function gals(v){ return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:1})+' gal'; }
function pair(lb){ return lbs(lb)+' / '+gals(lb/LB_PER_GAL); }
function galToLb(gal){ return gal*LB_PER_GAL; }
function lbToGal(lb){ return lb/LB_PER_GAL; }
var lastText='';
function feeDecision(requiredLb, waiverMinGal, handlingFee, pricePerGal){
  var normalLb=Math.max(0,requiredLb);
  var normalGal=lbToGal(normalLb);
  var waiverUpliftGal=Math.max(normalGal,waiverMinGal);
  var extraForWaiverGal=Math.max(0,waiverUpliftGal-normalGal);
  var waiverWorthIt=waiverMinGal>0&&handlingFee>0&&(extraForWaiverGal*pricePerGal)<handlingFee;
  if(waiverWorthIt) return {upliftLb:galToLb(waiverUpliftGal),fuelCost:waiverUpliftGal*pricePerGal,fees:0,waived:handlingFee};
  return {upliftLb:normalLb,fuelCost:normalGal*pricePerGal,fees:handlingFee||0,waived:0};
}
function evaluate(mode){
  var p1=n('price1'),p2=n('price2'),p3=n('price3');
  var startFuel1=n('startFuel1');
  var b1=n('burn1'),b2=n('burn2'),b3=n('burn3');
  var t1=n('time1'),t2=n('time2');
  var carryRate=n('carryRate');
  var cap12=n('extraCap12'),cap13=n('extraCap13');
  var tankerTo2=0,tankerTo3=0;
  if(mode==='stop2') tankerTo2=Math.min(b2,cap12);
  if(mode==='stop3'){ tankerTo2=Math.min(b2,cap13); tankerTo3=Math.min(b3,Math.max(0,cap13-tankerTo2)); }
  var carryPenalty2=tankerTo2*carryRate*t1;
  var carryPenalty3=tankerTo3*carryRate*(t1+t2);
  var totalCarryPenalty=carryPenalty2+carryPenalty3;
  var tankerFuel=tankerTo2+tankerTo3;
  var stop1RequiredLb=Math.max(0,(b1+tankerFuel)-startFuel1);
  var stop1UpliftLb=Math.max(stop1RequiredLb,galToLb(n('waiverFuel1')));
  var stop1UpliftGal=lbToGal(stop1UpliftLb);
  var stop1Fees=(stop1UpliftGal>=n('waiverFuel1')&&n('waiverFuel1')>0)?0:n('handling1');
  var stop1Waived=(stop1UpliftGal>=n('waiverFuel1')&&n('waiverFuel1')>0)?n('handling1'):0;
  var stop1FuelCost=stop1UpliftGal*p1;
  var stop2=feeDecision(Math.max(0,b2-(tankerTo2-carryPenalty2)),n('waiverFuel2'),n('handling2'),p2);
  var stop3=feeDecision(Math.max(0,b3-(tankerTo3-totalCarryPenalty)),n('waiverFuel3'),n('handling3'),p3);
  var totalFees=stop1Fees+stop2.fees+stop3.fees;
  var totalFuelCost=stop1FuelCost+stop2.fuelCost+stop3.fuelCost;
  var totalCost=totalFuelCost+totalFees;
  return {mode:mode,startFuel1:startFuel1,tankerFuel:tankerFuel,carryPenalty:totalCarryPenalty,totalCost:totalCost,totalFees:totalFees,waived:stop1Waived+stop2.waived+stop3.waived,u1:stop1UpliftLb,u2:stop2.upliftLb,u3:stop3.upliftLb};
}
function runCalc(){
  g('taptest').textContent='Button tap detected.';
  var standard=evaluate('standard');
  var stop2=evaluate('stop2');
  var stop3=evaluate('stop3');
  var best=standard;
  if(stop2.totalCost<best.totalCost) best=stop2;
  if(stop3.totalCost<best.totalCost) best=stop3;
  var label=best.mode==='standard'?'Standard fueling favored':(best.mode==='stop2'?'Max tanker through stop 2':'Max tanker through stop 3');
  var savings=standard.totalCost-best.totalCost;
  g('headline').textContent=label;
  g('results').innerHTML='Savings vs standard: <b>'+money(savings)+'</b><br>Best total cost: <b>'+money(best.totalCost)+'</b><br>Stop 1 uplift: '+pair(best.u1)+'<br>Stop 2 uplift: '+pair(best.u2)+'<br>Stop 3 uplift: '+pair(best.u3)+'<br>Tanker fuel: '+lbs(best.tankerFuel)+'<br>Carry penalty: '+lbs(best.carryPenalty)+'<br>Fees paid: '+money(best.totalFees)+'<br>Waived-fee value: '+money(best.waived);
  lastText='Fuel Savings Summary\nMission: '+g('aircraft').value+'\nRecommended option: '+label+'\nSavings versus standard fueling: '+money(savings)+'\nBest total trip cost: '+money(best.totalCost)+'\nStarting fuel before stop 1 uplift: '+lbs(best.startFuel1)+'\nStop 1 uplift: '+pair(best.u1)+'\nStop 2 uplift: '+pair(best.u2)+'\nStop 3 uplift: '+pair(best.u3)+'\nRecommended tanker fuel: '+lbs(best.tankerFuel)+'\nCarry penalty fuel: '+lbs(best.carryPenalty)+'\nHandling fees paid: '+money(best.totalFees)+'\nWaived-fee value: '+money(best.waived);
  g('textdump').textContent=lastText;
}
function loadSample(){ g('taptest').textContent='Load Sample tap detected.'; runCalc(); }
function showText(){ g('taptest').textContent='Show Savings Text tap detected.'; if(!lastText) runCalc(); g('textdump').textContent=lastText; }
runCalc();
</script>
</body>
</html>
